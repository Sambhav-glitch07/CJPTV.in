<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CJPTV.in</title>

<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="particleCanvas"></canvas>
<!-- SIDEBAR -->

  <div id="sidebar" class="sidebar">
<footer class="footer">
    <p>
        © <span id="copyrightYear"></span> CJPTV.in. All Rights Reserved.
    </p>
    <p class="made-by">
        Made with ❤️ by <strong>Sambhav Gupta</strong>
    </p>
</footer>
    <div class="account-box">

        <img id="userAvatar"
     src="https://ui-avatars.com/api/?name=Guest&background=f8501c&color=fff"
     class="account-avatar"
     referrerpolicy="no-referrer">

        <div class="account-info">
            <span id="userName">Guest</span>
            <small id="userStatus">Not signed in</small>
        </div>

        <button id="sidebarLoginBtn" class="sidebar-login-btn">
            Login
        </button>

    </div>

    <button id="newChatBtn" class="new-chat-btn">
        + New Chat
    </button>


    <div class="sidebar-header">
        <h2>Chat History</h2>
        <button id="closeSidebar">✕</button>
    </div>

    <div id="historyList"></div>
<div class="social-links">

  <a href="https://instagram.com/realcjptv.in" target="_blank">
    📷 Follow us on Instagram
  </a>

</div>
  </div>

<!-- NAME MODAL -->

<div id="nameModal" class="modal">

  <div class="modal-box">

    <div class="welcome-logo">
      ✨
    </div>

  <h2>Welcome to CJPTV AI</h2>

<p>Choose how you want to continue</p>

<button id="googleLoginBtn">
    Continue with Google
</button>

<div class="login-divider">
    <span>OR</span>
</div>

<button id="guestBtn">
    Continue as Guest
</button>

  </div>

</div>

<!-- TOP BAR -->

<div class="topbar">

  <div class="top-left">
<button id="menuBtn" class="icon-btn">☰</button>

    <a href="index.html" class="app-logo">
<img src="assets/logo.png" alt="CJPTV">
    </a>

  </div>
<div class="news-ticker">
    <div class="ticker-label">🔴 LIVE</div>

    <div class="ticker-content">
        <div id="tickerText">Loading latest headlines...</div>
    </div>
</div>
</div>

<!-- HERO -->

<div class="hero" id="hero">

  <div class="logo">
<img src="assets/logo.png" alt="CJPTV">
  </div>

  <h1 id="heroText">
    What's next?
  </h1>

</div>

<!-- CHAT -->

<div id="chat"></div>

<!-- GLOW -->

<div class="bottom-glow"></div>

<!-- INPUT -->

<div class="input-bar">

  <input
    id="userInput"
    type="text"
    placeholder="Ask CJPTV..."
    autocomplete="off">

  <button id="sendBtn">
    ➤
  </button>

</div>
<div id="imageViewer" class="image-viewer">

  <span id="closeImage">✕</span>

  <span id="downloadImage">⬇️</span>

  <img id="viewerImg">


</div>
<script src="memory.js"></script>
<script src="wiki.js"></script>
<script src="router.js"></script>
<script src="search.js"></script>

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
